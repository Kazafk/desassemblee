name: Mise à jour des scores politiques

on:
  schedule:
    - cron: "0 6 * * 1"   # Chaque lundi à 6h UTC
  workflow_dispatch:        # Déclenchement manuel possible

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r scripts/requirements.txt

      - name: Tests unitaires
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Télécharger les votes (open data AN, législature courante)
        run: python scripts/fetch_an_archives.py

      - name: Calculer les scores gauche-droite
        run: python scripts/compute_scores.py

      - name: Construire scores.json
        run: python scripts/build_data.py

      - name: Commit automatique si scores.json modifié
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: mise à jour scores politiques [${{ github.event.schedule || 'manuel' }}]"
          file_pattern: docs/data/scores.json data/processed/scores_computed.json
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
